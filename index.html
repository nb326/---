<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  width:100vw;height:100vh;
  overflow:hidden;
  cursor:none;
  font-family:'Tajawal',sans-serif;
}

#horse{
  position:absolute;
  font-size:64px;
  line-height:1;
  cursor:pointer;
  user-select:none;
  filter:grayscale(1) brightness(3);
  transition:transform .08s;
  will-change:transform;
}
#horse:hover{transform:scale(1.15)}
#horse:active{transform:scale(.92)}

/* MESSAGE SCREEN */
#msg{
  display:none;
  position:fixed;inset:0;
  background:#000;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2rem;
  direction:rtl;
  animation:fadeIn .8s ease;
  z-index:10;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#msg .big{
  font-size:clamp(1.6rem,5vw,3rem);
  font-weight:800;
  color:#fff;
  line-height:1.3;
  margin-bottom:1.5rem;
}

#msg .body{
  font-size:clamp(.85rem,2vw,1.1rem);
  color:rgba(255,255,255,.7);
  line-height:2;
  max-width:560px;
  font-weight:400;
}

#msg .from{
  margin-top:2.5rem;
  font-size:1rem;
  color:rgba(255,255,255,.35);
  font-weight:400;
  letter-spacing:.05em;
}

/* little pulse on the horse before clicked */
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
</style>
</head>
<body>

<div id="horse">🐴</div>

<div id="msg">
  <div style="font-size:clamp(.85rem,2vw,1rem);color:rgba(255,255,255,.35);margin-bottom:1.2rem;letter-spacing:.08em">مش ناسيتك</div>
  <div class="big">كل عام وانت بخير<br>وصحة وعافية 🌹</div>
  <div class="body">
    أَيا مَن لَيسَ لي أَهلٌ سِواهُ<br>
    وَيا وَطَني وَإِن جارَ القَضاءُ<br>
    <span style="font-size:.8em;color:rgba(255,255,255,.35)">— المتنبي</span>
  </div>
  <div class="from">— ديفولا بتسلم عليك من بعيد 🐴</div>
</div>

<script>
const horse = document.getElementById('horse');
const msg = document.getElementById('msg');

const SIZE = 64;
let x, y, vx, vy;
let W = window.innerWidth;
let H = window.innerHeight;

const SPEED = 2.8;

function randomVelocity() {
  const angle = Math.random() * Math.PI * 2;
  return {
    vx: Math.cos(angle) * SPEED,
    vy: Math.sin(angle) * SPEED
  };
}

function init() {
  x = Math.random() * (W - SIZE);
  y = Math.random() * (H - SIZE);
  const v = randomVelocity();
  vx = v.vx; vy = v.vy;
  // make sure not too slow on any axis
  if (Math.abs(vx) < 1) vx = vx < 0 ? -1.2 : 1.2;
  if (Math.abs(vy) < 1) vy = vy < 0 ? -1.2 : 1.2;
}

function loop() {
  x += vx;
  y += vy;

  let bounced = false;

  if (x <= 0) { x = 0; vx = Math.abs(vx); bounced = true; }
  if (x + SIZE >= W) { x = W - SIZE; vx = -Math.abs(vx); bounced = true; }
  if (y <= 0) { y = 0; vy = Math.abs(vy); bounced = true; }
  if (y + SIZE >= H) { y = H - SIZE; vy = -Math.abs(vy); bounced = true; }

  horse.style.left = x + 'px';
  horse.style.top = y + 'px';

  requestAnimationFrame(loop);
}

horse.addEventListener('click', () => {
  msg.style.display = 'flex';
  setTimeout(() => {
    let glitchCount = 0;
    const glitch = setInterval(() => {
      msg.style.opacity = Math.random() > 0.5 ? '1' : '0.08';
      msg.style.transform = `translate(${(Math.random()-0.5)*24}px, ${(Math.random()-0.5)*12}px)`;
      glitchCount++;
      if (glitchCount > 20) {
        clearInterval(glitch);
        msg.style.opacity = '1';
        msg.style.transform = 'none';
        msg.innerHTML = '<div style="font-family:Tajawal,sans-serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:700;color:#fff;direction:rtl;line-height:2;text-align:center">خلص يلا فوت نام 🐴</div>';
      }
    }, 80);
  }, 10000);
});

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
});

init();
loop();
</script>
</body>
</html>
